name: field-service-job-order

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: field-service-app
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: field_service_job_order_management
      DB_USERNAME: field_service_user
      DB_PASSWORD: field_service_password
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: field-service-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: field-service-mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: field_service_job_order_management
      MYSQL_USER: field_service_user
      MYSQL_PASSWORD: field_service_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: